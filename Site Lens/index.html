<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f6">
  <title>SiteLens — 现场问题记录</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172b27;
      --muted: #788780;
      --line: #e7ece9;
      --paper: #fff;
      --canvas: #f5f7f6;
      --green: #176b55;
      --green-dark: #105642;
      --green-pale: #e8f3ee;
      --orange: #bd6c2c;
      --orange-pale: #fff1e5;
      --red: #ae4d49;
      --red-pale: #fceceb;
      --shadow: 0 18px 50px rgba(25, 50, 43, .09);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); min-height: 100vh; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100vh; }
    .sidebar {
      width: 244px; background: #fff; border-right: 1px solid var(--line);
      position: fixed; inset: 0 auto 0 0; display: flex; flex-direction: column; padding: 26px 17px;
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 10px; margin-bottom: 44px; }
    .brand-mark { width: 36px; height: 36px; border-radius: 11px; color: white; background: var(--green); display: grid; place-items: center; }
    .brand-mark svg { width: 21px; height: 21px; }
    .brand-name { font-weight: 750; font-size: 19px; letter-spacing: -.6px; }
    .brand-caption { color: #9aa69f; font-size: 10px; letter-spacing: 1.3px; margin-top: 2px; }
    .nav-label { text-transform: uppercase; letter-spacing: 1px; font-size: 10px; color: #a3aea8; font-weight: 700; padding: 0 11px; margin: 0 0 10px; }
    .nav { display: grid; gap: 5px; }
    .nav-button { display: flex; align-items: center; gap: 12px; border: 0; background: transparent; color: #66756e; padding: 11px 12px; border-radius: 9px; text-align: left; width: 100%; font-size: 13px; }
    .nav-button svg { width: 17px; height: 17px; }
    .nav-button.active { background: var(--green-pale); color: var(--green-dark); font-weight: 650; }
    .nav-count { margin-left: auto; color: #87958e; font-size: 11px; }
    .sidebar-bottom { margin-top: auto; }
    .help-card { border-radius: 12px; background: #f5f8f6; padding: 14px; margin: 0 4px 18px; }
    .help-card strong { font-size: 12px; display: block; margin-bottom: 5px; }
    .help-card span { font-size: 11px; line-height: 1.6; color: var(--muted); display: block; }
    .profile { border-top: 1px solid var(--line); padding: 18px 7px 0; display: flex; align-items: center; gap: 10px; }
    .avatar { display: grid; place-items: center; width: 34px; height: 34px; flex: 0 0 auto; border-radius: 50%; background: #dbeae3; color: var(--green-dark); font-size: 12px; font-weight: 700; }
    .profile-name { font-size: 12px; font-weight: 650; }
    .profile-role { color: var(--muted); font-size: 10px; margin-top: 3px; }
    main { margin-left: 244px; min-height: 100vh; padding: 30px 42px 52px; max-width: 1680px; }
    .topbar { height: 42px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 38px; }
    .breadcrumb { color: #8d9a93; font-size: 12px; }
    .breadcrumb b { color: #34473f; font-weight: 600; }
    .top-actions { display: flex; align-items: center; gap: 18px; }
    .project-select { border: 1px solid var(--line); color: #50615a; background: #fff; border-radius: 8px; padding: 9px 12px; font-size: 12px; }
    .icon-button { border: 0; width: 34px; height: 34px; border-radius: 9px; background: white; color: #68776f; display: grid; place-items: center; }
    .icon-button svg { width: 17px; }
    .welcome { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 27px; }
    .eyebrow { color: var(--green); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.3px; margin-bottom: 9px; }
    h1 { font-size: clamp(25px, 3vw, 31px); letter-spacing: -1px; margin: 0; font-weight: 700; }
    .subtitle { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
    .primary-button { border: 0; border-radius: 8px; background: var(--green); color: white; padding: 11px 15px; font-size: 12px; font-weight: 650; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 3px 9px #176b5524; transition: background .15s, transform .15s; white-space: nowrap; }
    .primary-button:hover { background: var(--green-dark); transform: translateY(-1px); }
    .primary-button svg { width: 16px; height: 16px; }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; margin-bottom: 29px; }
    .stat-card { background: var(--paper); border: 1px solid var(--line); border-radius: 11px; padding: 17px 18px; min-height: 99px; }
    .stat-top { display: flex; align-items: center; justify-content: space-between; color: #78877f; font-size: 11px; }
    .stat-icon { width: 29px; height: 29px; border-radius: 8px; background: #f1f6f3; color: var(--green); display: grid; place-items: center; }
    .stat-icon svg { width: 15px; }
    .stat-value { margin-top: 10px; font-size: 24px; font-weight: 700; letter-spacing: -.6px; }
    .stat-note { color: #93a099; font-size: 10px; margin-left: 6px; font-weight: 450; letter-spacing: 0; }
    .content-grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(270px, .9fr); gap: 19px; align-items: start; }
    .panel { border: 1px solid var(--line); background: white; border-radius: 11px; overflow: hidden; }
    .panel-heading { padding: 17px 19px; border-bottom: 1px solid #eef1ef; display: flex; justify-content: space-between; align-items: center; }
    .panel-title { font-size: 13px; font-weight: 700; margin: 0; }
    .panel-meta { color: #95a099; font-size: 10px; margin-top: 4px; }
    .text-button { background: none; border: 0; color: var(--green); font-size: 11px; font-weight: 650; padding: 5px; }
    .visits { padding: 0 19px; }
    .visit-row { padding: 17px 0; border-bottom: 1px solid #eff2f0; display: flex; align-items: center; gap: 13px; }
    .visit-row:last-child { border-bottom: 0; }
    .visit-icon { width: 39px; height: 39px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 10px; background: #f1f6f3; color: var(--green); }
    .visit-icon svg { width: 18px; }
    .visit-info { min-width: 0; flex: 1; }
    .visit-name { font-size: 12px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .visit-sub { font-size: 10px; color: #89968f; margin-top: 5px; }
    .visit-count { flex: 0 0 auto; font-size: 10px; color: #64746c; background: #f4f6f5; padding: 6px 8px; border-radius: 6px; }
    .issues { padding: 0 18px 5px; }
    .issue-row { width: 100%; text-align: left; border: 0; border-bottom: 1px solid #eff2f0; background: white; padding: 14px 0; display: flex; gap: 10px; align-items: flex-start; }
    .issue-row:last-child { border-bottom: 0; }
    .issue-row:hover .issue-title { color: var(--green); }
    .issue-thumb { width: 43px; height: 43px; flex: 0 0 auto; border-radius: 8px; background: #edf2ef; display: grid; place-items: center; color: #91a097; overflow: hidden; }
    .issue-thumb img { height: 100%; width: 100%; object-fit: cover; }
    .issue-thumb svg { width: 18px; }
    .issue-copy { min-width: 0; flex: 1; }
    .issue-title { display: block; font-size: 11px; line-height: 1.45; font-weight: 650; transition: color .15s; }
    .issue-place { display: block; color: #8c9992; font-size: 10px; margin-top: 4px; }
    .issue-tags { display: flex; align-items: center; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
    .tag { font-size: 9px; padding: 4px 6px; border-radius: 5px; color: #65756d; background: #f2f5f3; }
    .tag.high { color: var(--red); background: var(--red-pale); }
    .tag.medium { color: var(--orange); background: var(--orange-pale); }
    .tag.status-open { color: var(--orange); background: var(--orange-pale); }
    .tag.status-progress { color: #4772a1; background: #eaf1f8; }
    .tag.status-done { color: var(--green); background: var(--green-pale); }
    .empty-state { color: #91a097; font-size: 12px; text-align: center; padding: 34px 10px; }
    .filterbar { padding: 12px 18px; display: flex; gap: 8px; border-bottom: 1px solid #eff2f0; }
    .search { width: 100%; position: relative; }
    .search svg { position: absolute; left: 10px; top: 9px; width: 14px; color: #95a199; }
    .search input { width: 100%; border: 1px solid #e9eeeb; border-radius: 7px; padding: 8px 9px 8px 30px; font-size: 11px; outline: none; }
    .search input:focus, input:focus, textarea:focus, select:focus { border-color: #79aa95; box-shadow: 0 0 0 3px #176b5514; outline: none; }
    .status-select { border: 1px solid #e9eeeb; border-radius: 7px; padding: 7px 8px; color: #66756e; background: #fff; font-size: 10px; }
    .issue-list-panel { margin-top: 21px; }
    .issue-list-panel .issues { padding: 0 19px; }
    .issue-list-panel .issue-row { padding: 13px 0; }
    .section-hidden { display: none; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 5; background: rgba(16, 31, 26, .42); display: grid; place-items: center; padding: 20px; }
    .modal { width: min(100%, 510px); max-height: min(92vh, 800px); overflow: auto; background: white; border-radius: 14px; box-shadow: var(--shadow); }
    .modal-header { padding: 19px 22px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; justify-content: space-between; }
    .modal-header h2 { font-size: 16px; margin: 0; }
    .modal-header p { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
    .close-button { border: 0; background: #f3f6f4; border-radius: 7px; width: 28px; height: 28px; color: #69776f; font-size: 19px; line-height: 1; }
    .form { padding: 19px 22px 22px; display: grid; gap: 14px; }
    .field { display: grid; gap: 6px; }
    .field label { font-size: 11px; color: #485a51; font-weight: 650; }
    .field input, .field textarea, .field select { width: 100%; border: 1px solid #e4eae6; border-radius: 7px; padding: 10px 11px; color: var(--ink); background: #fff; font-size: 12px; }
    .field textarea { min-height: 82px; resize: vertical; line-height: 1.5; }
    .field input::placeholder, .field textarea::placeholder { color: #aab4ae; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .photo-upload { position: relative; min-height: 84px; border: 1px dashed #cbd8d0; background: #f8faf9; border-radius: 8px; display: grid; place-items: center; color: #718078; overflow: hidden; }
    .photo-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .upload-prompt { text-align: center; font-size: 11px; pointer-events: none; }
    .upload-prompt svg { width: 19px; display: block; margin: 0 auto 5px; color: var(--green); }
    .photo-preview { width: 100%; max-height: 190px; object-fit: cover; display: none; }
    .voice-row { display: flex; align-items: center; gap: 9px; }
    .voice-button { border: 1px solid #dce7e0; background: white; color: var(--green); padding: 8px 10px; border-radius: 7px; font-size: 10px; display: inline-flex; align-items: center; gap: 6px; }
    .voice-button svg { width: 14px; }
    .voice-note { font-size: 10px; color: #97a39c; }
    .file-input-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
    .detail-audio { width: 100%; margin: 0 0 14px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 9px; padding-top: 3px; }
    .secondary-button { border: 1px solid #e2e8e4; color: #5d6b64; border-radius: 8px; background: white; padding: 10px 13px; font-size: 11px; }
    .detail-content { padding: 20px 22px 22px; }
    .detail-photo { width: 100%; max-height: 260px; object-fit: cover; border-radius: 9px; margin-bottom: 17px; }
    .detail-description { color: #607067; font-size: 12px; line-height: 1.7; white-space: pre-wrap; margin: 13px 0 17px; }
    .detail-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; border-top: 1px solid var(--line); padding-top: 15px; }
    .detail-meta span { display: block; color: #94a098; font-size: 10px; margin-bottom: 4px; }
    .detail-meta strong { display: block; font-size: 11px; font-weight: 600; }
    .toast { position: fixed; z-index: 10; right: 25px; bottom: 24px; background: #173e32; color: white; padding: 12px 16px; border-radius: 8px; font-size: 12px; box-shadow: var(--shadow); animation: toast-in .2s ease-out; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .mobile-app { width: min(100%, 760px); min-height: 100vh; margin: 0 auto; padding: 0 28px 40px; }
    .app-header { height: 66px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
    .app-header .brand { margin: 0; padding: 0; gap: 9px; }
    .app-header .brand-mark { width: 31px; height: 31px; border-radius: 9px; }
    .app-header .brand-mark svg { width: 18px; height: 18px; }
    .app-header .brand-name { font-size: 17px; }
    .header-account { display: flex; align-items: center; gap: 8px; }
    .header-account .avatar { width: 30px; height: 30px; font-size: 10px; }
    .account-copy { min-width: 0; }
    .account-name { font-size: 11px; font-weight: 650; }
    .account-label, .auth-button { color: var(--muted); font-size: 9px; margin-top: 2px; }
    .auth-button { border: 0; background: none; padding: 0; }
    #authRoot .modal-backdrop { z-index: 20; }
    .header-project { display: grid; gap: 2px; }
    .header-project label { color: var(--muted); font-size: 9px; padding-left: 2px; }
    .header-project .project-select { max-width: 145px; font-size: 10px; padding: 5px 8px; }
    .feed { padding-top: 28px; }
    .feed-heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .feed-heading h1 { font-size: 25px; letter-spacing: -.7px; }
    .feed-heading p { margin: 6px 0 0; color: var(--muted); font-size: 11px; }
    .feed-heading p span { color: var(--ink); font-weight: 650; }
    .feed-heading .primary-button { padding: 10px 13px; }
    .status-filters { display: flex; gap: 8px; overflow-x: auto; padding: 21px 0 14px; scrollbar-width: none; }
    .status-filters::-webkit-scrollbar { display: none; }
    .filter-chip { flex: 0 0 auto; border: 1px solid transparent; border-radius: 20px; background: #edf1ef; color: #65746c; padding: 7px 12px; font-size: 10px; }
    .filter-chip.active { border-color: #d7e8df; background: var(--green-pale); color: var(--green-dark); font-weight: 650; }
    .feed-issues { padding: 0; }
    .feed-issues .issue-row { align-items: center; gap: 12px; padding: 15px 0; }
    .feed-issues .issue-thumb { width: 54px; height: 54px; border-radius: 9px; }
    .feed-issues .issue-thumb svg { width: 21px; }
    .feed-issues .issue-title { font-size: 13px; }
    .feed-issues .issue-place { font-size: 10px; }
    .feed-issues .tag { font-size: 9px; }
    .feed-issues .issue-row:last-child { border-bottom: 0; }
    .modal-backdrop { padding: 12px; }
    .modal { border-radius: 13px; }
    .form-row { grid-template-columns: 1fr; }
    @media (min-width: 700px) {
      body { padding: 24px 0; }
      .mobile-app { min-height: calc(100vh - 48px); border: 1px solid var(--line); border-radius: 14px; background: #fff; padding: 0 34px 30px; box-shadow: 0 4px 20px rgba(25, 50, 43, .035); }
      .feed { padding-top: 34px; }
      .feed-issues .issue-row { padding: 17px 2px; }
    }
    @media (max-width: 520px) {
      body { background: #fff; }
      .mobile-app { padding: 0 17px 100px; }
      .app-header { height: 58px; }
      .app-header .brand-mark { width: 29px; height: 29px; }
      .app-header .brand-name { font-size: 16px; }
      .header-account { gap: 6px; }
      .header-account .avatar { width: 28px; height: 28px; }
      .account-name { font-size: 10px; }
      .account-label { font-size: 8px; }
      .header-project .project-select { max-width: 125px; font-size: 9px; padding: 5px 6px; }
      .feed { padding-top: 24px; }
      .feed-heading h1 { font-size: 23px; }
      .feed-heading .primary-button { position: fixed; z-index: 3; bottom: max(16px, env(safe-area-inset-bottom)); left: 17px; right: 17px; height: 48px; justify-content: center; font-size: 13px; box-shadow: 0 7px 20px #176b5538; }
      .status-filters { padding-top: 20px; }
      .feed-issues .issue-row { padding: 14px 0; }
      .feed-issues .issue-thumb { width: 50px; height: 50px; }
      .form { padding: 17px; gap: 13px; }
      .modal-header { padding: 17px; }
      .detail-content { padding: 17px; }
      .modal-actions .primary-button { min-height: 42px; }
      .toast { right: 15px; bottom: max(76px, calc(env(safe-area-inset-bottom) + 66px)); left: 15px; text-align: center; }
    }
  </style>
</head>
<body>
  <main class="mobile-app">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5M8 11h5.5M10.75 8v6"/></svg>
        </div>
        <div class="brand-name">SiteLens</div>
      </div>
      <div class="header-account" aria-label="当前登录用户 Michael Shi">
        <div class="header-project">
          <label for="projectFilter">项目</label>
          <select class="project-select" id="projectFilter" aria-label="筛选项目">
            <option value="all">全部项目</option>
            <option value="SGP Project" selected>SGP Project</option>
          </select>
        </div>
        <div class="avatar">MS</div>
        <div class="account-copy"><div class="account-name">Michael Shi</div><button type="button" class="auth-button" id="authButton">仅查看</button></div>
      </div>
    </header>

    <section class="feed">
      <div class="feed-heading">
        <div><h1>现场记录</h1><p><span id="issueCount">0</span> 条记录 · <span id="dataSource">正在读取 GitHub</span></p></div>
        <button class="primary-button" id="newIssueButton">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>记录
        </button>
      </div>
      <nav class="status-filters" aria-label="按状态筛选">
        <button class="filter-chip active" data-status="all">全部</button>
        <button class="filter-chip" data-status="open">新建</button>
        <button class="filter-chip" data-status="progress">处理中</button>
        <button class="filter-chip" data-status="done">已解决</button>
      </nav>
      <div class="issues feed-issues" id="allIssues"></div>
    </section>
  </main>

  <div id="modalRoot"></div>
  <div id="authRoot"></div>
  <div id="toastRoot" aria-live="polite"></div>

  <script>
    let issues = [];
    let selectedPhoto = null;
    let selectedAudio = null;
    let recognition = null;
    let mediaRecorder = null;
    let recordingStream = null;
    let audioChunks = [];
    let photoPreviewUrl = "";
    let selectedStatus = "all";
    let selectedProject = "SGP Project";
    const $ = (selector) => document.querySelector(selector);
    const statusNames = { open: "新建", progress: "处理中", done: "已解决" };
    const statusClasses = { open: "status-open", progress: "status-progress", done: "status-done" };
    const VIEW_URL = "https://j2vhttcknq-max.github.io/RFP-new/Site%20Lens/index.html";
    const WORKBOOK_URL = "https://raw.githubusercontent.com/j2vhttcknq-max/RFP-new/main/Site%20Lens/DS/SiteLens.xlsx";
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    const dateLabel = (value) => new Intl.DateTimeFormat("zh-CN", { month: "long", day: "numeric" }).format(new Date(value));
    function githubFileUrl(repoPath) {
      return `https://raw.githubusercontent.com/j2vhttcknq-max/RFP-new/main/${repoPath.split("/").map(encodeURIComponent).join("/")}`;
    }
    function excelDate(value) {
      if (value instanceof Date) return value.toISOString();
      const serial = Number(value);
      if (!value || Number.isNaN(serial)) return value || "";
      return new Date(Math.round((Date.UTC(1899, 11, 30) + serial * 86400000) / 1000) * 1000).toISOString();
    }
    async function readZipText(buffer, entryName) {
      const view = new DataView(buffer);
      const bytes = new Uint8Array(buffer);
      let eocd = -1;
      for (let index = bytes.length - 22; index >= Math.max(0, bytes.length - 22 - 65535); index -= 1) {
        if (view.getUint32(index, true) === 0x06054b50) { eocd = index; break; }
      }
      if (eocd < 0) throw new Error("无法解析现场记录表。");
      const count = view.getUint16(eocd + 10, true);
      let offset = view.getUint32(eocd + 16, true);
      const decoder = new TextDecoder();
      for (let entry = 0; entry < count; entry += 1) {
        if (view.getUint32(offset, true) !== 0x02014b50) throw new Error("无法解析现场记录表。");
        const method = view.getUint16(offset + 10, true);
        const compressedSize = view.getUint32(offset + 20, true);
        const nameLength = view.getUint16(offset + 28, true);
        const extraLength = view.getUint16(offset + 30, true);
        const commentLength = view.getUint16(offset + 32, true);
        const localOffset = view.getUint32(offset + 42, true);
        const name = decoder.decode(bytes.subarray(offset + 46, offset + 46 + nameLength));
        if (name === entryName) {
          const dataStart = localOffset + 30 + view.getUint16(localOffset + 26, true) + view.getUint16(localOffset + 28, true);
          const compressed = bytes.subarray(dataStart, dataStart + compressedSize);
          if (method === 0) return decoder.decode(compressed);
          const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
          return decoder.decode(await new Response(stream).arrayBuffer());
        }
        offset += 46 + nameLength + extraLength + commentLength;
      }
      return null;

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) { $("#voiceNote").textContent = "当前浏览器暂不支持语音识别"; return; }
      if (recognition) { recognition.stop(); recognition = null; $("#voiceNote").textContent = "语音输入已停止"; $("#voiceButton").innerHTML = "🎙 语音转文字"; return; }
      recognition = new SpeechRecognition();
      recognition.lang = "zh-CN";
      recognition.interimResults = false;
      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        const field = $("#issueDescription");
        field.value = `${field.value}${field.value ? " " : ""}${text}`;
      };
      recognition.onerror = (event) => { $("#voiceNote").textContent = `语音识别失败：${event.error}`; recognition = null; };
      recognition.onend = () => { recognition = null; $("#voiceNote").textContent = "点击开始语音输入"; $("#voiceButton").innerHTML = "🎙 语音转文字"; };
      recognition.start();
      $("#voiceNote").textContent = "正在聆听…再次点击停止";
      $("#voiceButton").textContent = "停止录音";
    }
    async function saveIssue(event) {
      event.preventDefault();
      if (mediaRecorder && mediaRecorder.state === "recording") {
        toast("保存前请先停止录音");
        return;
      }
      const data = new FormData(event.currentTarget);
      const fields = {
        project: String(data.get("project") || "").trim(),
        title: String(data.get("title") || "").trim(),
        description: String(data.get("description") || "").trim(),
        place: String(data.get("place") || "").trim() || "地点待补充",
        priority: String(data.get("priority") || "中").trim(),
        status: "open"
      };
      const validation = validateFields(fields);
      if (validation) { toast(validation); return; }
      if (!(await ensureToken())) return;
      const submitButton = $("#issueForm button[type=submit]");
      submitButton.disabled = true;
      submitButton.textContent = "保存中…";
      try {
        const id = crypto.randomUUID();
        const photoPaths = selectedPhoto ? [await storeAttachment(id, selectedPhoto, "photo")] : [];
        const audioPaths = selectedAudio ? [await storeAttachment(id, selectedAudio, "audio")] : [];
        const record = { ...fields, id, recordedBy: "Michael Shi", date: new Date().toISOString(), photoPaths, audioPaths, photos: photoPaths.map((relativePath) => githubFileUrl(`Site Lens/source/${relativePath}`)), audios: audioPaths.map((relativePath) => githubFileUrl(`Site Lens/source/${relativePath}`)) };
        await commitIssues([record, ...issues], "Add Site Lens record.");
        closeModal();
        toast("记录已提交到 GitHub");
      } catch (error) {
        console.error("Unable to save SiteLens record.", error);
        toast(error.message || "记录保存失败，请重试");
        if ($("#issueForm button[type=submit]")) {
          $("#issueForm button[type=submit]").disabled = false;
          $("#issueForm button[type=submit]").textContent = "保存记录";
        }
      }
    }
    function showDetails(id) {
      const issue = issues.find((item) => String(item.id) === String(id));
      if (!issue) return;
      selectedPhoto = null;
      selectedAudio = null;
      const photo = issue.photos?.[0] || "";
      const audio = issue.audios?.[0] || "";
      const priorityOption = (value) => `<option value="${value}" ${issue.priority === value ? "selected" : ""}>${value}</option>`;
      const statusOption = (value, label) => `<option value="${value}" ${issue.status === value ? "selected" : ""}>${label}</option>`;
      openModal(`<div class="modal-header"><div><h2>修改记录</h2><p>${escapeHtml(issue.project)} · ${dateLabel(issue.date)} · ${timeLabel(issue.date)} · ${escapeHtml(issue.recordedBy || "Michael Shi")}</p></div><button class="close-button" aria-label="关闭">×</button></div>
        <form class="form" id="editForm">
          <div class="field"><label for="issueTitle">问题标题</label><input id="issueTitle" name="title" required maxlength="100" value="${escapeHtml(issue.title)}"></div>
          <div class="field"><label for="issueDescription">问题描述</label><textarea id="issueDescription" name="description" maxlength="1200">${escapeHtml(issue.description || "")}</textarea>
            <div class="voice-row"><button type="button" id="voiceButton" class="voice-button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></svg>语音转文字</button><span class="voice-note" id="voiceNote">点击开始语音输入</span></div>
          </div>
          ${photo ? `<img class="detail-photo" src="${escapeHtml(photo)}" alt="现场问题照片">` : ""}
          ${audio ? `<audio class="detail-audio" controls preload="metadata" src="${escapeHtml(audio)}">浏览器不支持音频播放。</audio>` : ""}
          <div class="field"><label for="issuePhoto">更换照片 <span style="font-weight:400;color:#9aa69f">（可选）</span></label><input id="issuePhoto" type="file" accept="image/*" capture="environment"></div>
          <div class="field"><label>更换语音 <span style="font-weight:400;color:#9aa69f">（可选）</span></label><div class="voice-row"><button type="button" id="recordButton" class="voice-button">开始录音</button><label class="voice-button" for="audioFile">选择录音</label><input class="file-input-hidden" id="audioFile" type="file" accept="audio/*"><span class="voice-note" id="audioNote">不选则保留原来的语音</span></div></div>
          <div class="field"><label for="issuePlace">地点</label><input id="issuePlace" name="place" maxlength="100" value="${escapeHtml(issue.place)}"></div>
          <div class="form-row"><div class="field"><label for="issuePriority">优先级</label><select id="issuePriority" name="priority">${priorityOption("低")}${priorityOption("中")}${priorityOption("高")}</select></div><div class="field"><label for="detailStatus">状态</label><select id="detailStatus" name="status">${statusOption("open", "新建")}${statusOption("progress", "处理中")}${statusOption("done", "已解决")}</select></div></div>
          <div class="modal-actions"><button type="button" class="secondary-button" id="cancelEdit">取消</button><button class="primary-button" type="submit">保存修改</button></div>
        </form>`);
      $("#cancelEdit").addEventListener("click", closeModal);
      $("#issuePhoto").addEventListener("change", handlePhoto);
      $("#audioFile").addEventListener("change", handleAudioFile);
      $("#voiceButton").addEventListener("click", toggleVoice);
      $("#recordButton").addEventListener("click", toggleRecording);
      $("#editForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        if (mediaRecorder && mediaRecorder.state === "recording") { toast("保存前请先停止录音"); return; }
        const data = new FormData(event.currentTarget);
        const fields = {
          project: issue.project,
          title: String(data.get("title") || "").trim(),
          description: String(data.get("description") || "").trim(),
          place: String(data.get("place") || "").trim() || "地点待补充",
          priority: String(data.get("priority") || "").trim(),
          status: String(data.get("status") || "").trim()
        };
        const validation = validateFields(fields);
        if (validation) { toast(validation); return; }
        if (!(await ensureToken())) return;
        const submitButton = $("#editForm button[type=submit]");
        submitButton.disabled = true;
        submitButton.textContent = "保存中…";
        try {
          const photoPaths = selectedPhoto ? [await storeAttachment(issue.id, selectedPhoto, "photo")] : issue.photoPaths || [];
          const audioPaths = selectedAudio ? [await storeAttachment(issue.id, selectedAudio, "audio")] : issue.audioPaths || [];
          const updated = { ...issue, ...fields, photoPaths, audioPaths, photos: photoPaths.map((relativePath) => githubFileUrl(`Site Lens/source/${relativePath}`)), audios: audioPaths.map((relativePath) => githubFileUrl(`Site Lens/source/${relativePath}`)) };
          await commitIssues(issues.map((item) => item.id === issue.id ? updated : item), "Update Site Lens record.");
          closeModal();
          toast("修改已提交到 GitHub");
        } catch (error) {
          console.error("Unable to update SiteLens record.", error);
          toast(error.message || "修改保存失败，请重试");
          if ($("#editForm button[type=submit]")) {
            $("#editForm button[type=submit]").disabled = false;
            $("#editForm button[type=submit]").textContent = "保存修改";
          }
        }
      });
    }
    $("#newIssueButton").addEventListener("click", showCreate);
    $("#authButton").addEventListener("click", () => showAuthDialog());
    setAuthLabel();
    $("#projectFilter").addEventListener("change", (event) => {
      selectedProject = event.currentTarget.value;
      render();
    });
    document.querySelectorAll(".filter-chip").forEach((button) => {
      button.addEventListener("click", () => {
        selectedStatus = button.dataset.status;
        document.querySelectorAll(".filter-chip").forEach((chip) => chip.classList.toggle("active", chip === button));
        render();
      });
    });
    loadIssues();
  </script>
</body>
</html>
